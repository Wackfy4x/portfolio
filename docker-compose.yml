# Deployed locally by the Jenkins pipeline (Jenkins runs on this same VPS,
# so the image never leaves the host — no registry involved). IMAGE_TAG and
# HOST_PORT are written into a sibling .env file on each deploy (see the
# Jenkinsfile).
services:
  portfolio:
    image: portfolio-v3:${IMAGE_TAG:-latest}
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
