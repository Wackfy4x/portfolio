# Deployed to the VPS by the Jenkins pipeline. IMAGE_TAG and HOST_PORT are
# written into a sibling .env file on each deploy (see the Jenkinsfile).
services:
  portfolio:
    image: ghcr.io/CHANGE_ME_GITHUB_OWNER/portfolio-v3:${IMAGE_TAG:-latest}
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
